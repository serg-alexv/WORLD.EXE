name: WorldEXE
options:
  bundleIdPrefix: org.worldexe
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      COPY_PHASE_STRIP: YES
packages:
  LocalLlama:
    path: LocalLlama
  WorldCore:
    path: WorldCore
targets:
  WorldEXE:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WORLD.EXE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Камера нужна для LiDAR, схемы комнаты и игровых объектов в AR."
        NSLocalNetworkUsageDescription: "КОНТАКТ соединяет два устройства поблизости. Схема комнаты передаётся только выбранному напарнику после подтверждения."
        NSBonjourServices:
          - _world-contact._tcp
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App
    dependencies:
      - package: WorldCore
      - package: LocalLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.worldexe.prototype
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: WORLD.EXE
        INFOPLIST_KEY_NSCameraUsageDescription: "Use the camera for live LiDAR reconstruction and RoomPlan room capture. Simulated training does not use the camera."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
  WorldEXEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WorldEXE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.worldexe.prototype.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorldEXE
        CODE_SIGN_STYLE: Automatic
schemes:
  WorldEXE:
    build:
      targets:
        WorldEXE: all
        WorldEXEUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: WorldEXEUITests
