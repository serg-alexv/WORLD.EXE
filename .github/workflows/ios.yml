name: iOS build and gameplay tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4
        with:
          xcode-version: '26.3'
      - name: Install project generator
        run: brew install xcodegen
      - name: Core gameplay tests
        run: bash scripts/ci.sh core
      - name: Boot simulator and compile iOS tests
        timeout-minutes: 12
        run: bash scripts/ci.sh simulator
      - name: Complete expedition through UI and save screenshots
        timeout-minutes: 12
        run: bash scripts/ci.sh ui
      - name: Compile unsigned device app and package evidence
        timeout-minutes: 8
        run: bash scripts/ci.sh device
      - name: Preserve validation evidence and build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WORLD.EXE-validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/*.log
            build/*.txt
            build/*.md
            build/*.json
            build/*.zip
            build/screenshots
            build/TestResults.xcresult
            build/BuildForTesting.xcresult
            WorldEXE.xcodeproj
